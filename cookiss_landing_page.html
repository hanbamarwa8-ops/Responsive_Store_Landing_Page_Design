<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cookiss</title>
  <link rel="stylesheet" href="cookiss_landingpage.css" />
</head>

<body>
  <header class="header">
    <div class="logo">
      <a href="#"><img src="4.png" alt="Cookiss" /></a>
    </div>
    <nav class="nav">
      <ul>
        <li><a href="#">Accueil</a></li>
        <li><a href="#">Boutique</a></li>
        <li><a href="#">À propos</a></li>
        <li><a href="#">Contact</a></li>
      </ul>
    </nav>
    <button>Se connecter</button>
  </header>
  <main class="main">
    <div class="first-section">
      <img src="cookiss-landing-page.png" alt="Sweet Bites" class="main-img" />
      <button class="btn-acheter">Acheter</button>
    </div>
    <div class="sec-section">
      <h1>Découvrir la saveur authentique</h1>
      <h4>Ne rate pas cette opportunité !</h4>
      <ul class="products">
        <li class="product-card">
          <div class="product-img-wrapper">
            <span class="badge">Nouveauté</span>
            <img src="cookiss-redvelvet.webp" alt="Cookies red velvet" />
          </div>
          <p class="product-name">Cookies red velvet</p>
          <p class="product-price">10,000 د.ت</p>
        </li>
        <li class="product-card">
          <div class="product-img-wrapper">
            <img src="cookiss-framboise.webp" alt="Cookies framboise" />
          </div>
          <p class="product-name">Cookies framboise</p>
          <p class="product-price">10,000 د.ت</p>
        </li>
        <li class="product-card">
          <div class="product-img-wrapper">
            <img src="cookiss-seseame.avif" alt="Cookies sésame ">
          </div>
          <p class="product-name">Cookies sésame</p>
          <p class="product-price">7,000 د.ت</p>
        </li>
      </ul>
    </div>
  </main>
  <footer></footer>
</body>

</html>
